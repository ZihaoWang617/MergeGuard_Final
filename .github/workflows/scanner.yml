name: Scanner image CI
on:
  push:
    branches: [main]
    paths: ['scanner/**', 'tests/**', '.github/workflows/scanner.yml']
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run SAST rule tests (gate before image build)
        run: node --test tests/test-local.mjs tests/test-rules.mjs
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ./scanner
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mergeguard:${{ github.sha }}
      - run: echo "Pinned image digest = ${{ steps.build.outputs.digest }}"
